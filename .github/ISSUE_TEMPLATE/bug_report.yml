name: 🐞 Bug report
description: Something doesn't work or shows an error.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time! The more detail, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /coa status
      description: Type `/coa status` in game and copy the lines here (or a screenshot).
      render: text
  - type: textarea
    id: error
    attributes:
      label: Lua error (if any)
      description: Turn on errors with `/console scriptErrors 1`, or use BugSack, and paste the full error.
      render: text
  - type: input
    id: version
    attributes:
      label: Addon version
      placeholder: e.g. 0.6.0
  - type: textarea
    id: other
    attributes:
      label: Other addons, screenshots, anything else
